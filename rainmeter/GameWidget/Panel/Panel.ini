; GENERATED by rainmeter/build_skins.py - edit that, not this file.
[Rainmeter]
Update=1000
AccurateText=1
Group=GameWidget
ContextTitle=Refresh game data
ContextAction=["#PythonW#" "#MainPy#" --refresh]
ContextTitle2=Ask Claude what to play
ContextAction2=["#PythonW#" "#MainPy#" --inspire]
ContextTitle3=Edit appearance
ContextAction3=[!ToggleConfig "GameWidget\Settings" "Settings.ini"]
ContextTitle4=Open service log folder
ContextAction4=["%APPDATA%\GameWidget"]

[Metadata]
Name=Game Widget - Panel
Author=benlaw7
Information=Recent, most played and dusty games stacked in one dark panel.
Version=0.1
License=MIT

[Variables]
@Include=#@#Style.inc
@Include2=#@#data.inc
@Include3=#@#Settings.inc
; Layout (formulas, resolved where used)
Top=(44+(1-#StatusHidden#)*14)
RShown=(Min(#RCount#,4))
RH=((#RShown# > 0) ? (30+#RShown#*28) : 0)
RTop=#Top#
MShown=(Min(#MCount#,4))
MH=((#MShown# > 0) ? (30+#MShown#*28) : 0)
MTop=(#RTop#+#RH#)
DShown=(Min(#DCount#,4))
DH=((#DShown# > 0) ? (30+#DShown#*28) : 0)
DTop=(#MTop#+#MH#)
BtnY=((#DTop#+#DH#)+2)
PanelH=(#BtnY#+50)

[Background]
Meter=Shape
Shape=Rectangle 0.5,0.5,299,(#PanelH#-1),12 | Fill Color #BackgroundColor#,#BackgroundOpacity# | StrokeWidth 1 | Stroke Color #BorderColor#,#BorderOpacity#

[Title]
Meter=String
MeterStyle=sText
X=16
Y=14
FontFace=#TitleFont#
FontSize=11
FontWeight=700
Text=Games

[Cog]
Meter=String
MeterStyle=sText
X=4R
Y=15
FontFace=Segoe MDL2 Assets
FontSize=10
FontColor=#MutedTextColor#
Padding=3,3,3,3
SolidColor=0,0,0,1
Text=[\xE713]
ToolTipText=Appearance
MouseOverAction=[!SetOption Cog FontColor #TextColor#][!UpdateMeter Cog][!Redraw]
MouseLeaveAction=[!SetOption Cog FontColor #MutedTextColor#][!UpdateMeter Cog][!Redraw]
LeftMouseUpAction=[!ToggleConfig "GameWidget\Settings" "Settings.ini"][!Move [SettingsX] #CURRENTCONFIGY# "GameWidget\Settings"]
DynamicVariables=1

[SettingsX]
Measure=Calc
DynamicVariables=1
Formula=((#CURRENTCONFIGX#+#CURRENTCONFIGWIDTH#+340 > #VSCREENAREAX#+#VSCREENAREAWIDTH#) ? (#CURRENTCONFIGX#-330) : (#CURRENTCONFIGX#+#CURRENTCONFIGWIDTH#+10))

[Meta]
Meter=String
MeterStyle=sText | sMuted
X=284
Y=18
StringAlign=Right
Text=#Updated#  [\x00B7]  #GameCount# games

[Status]
Meter=String
MeterStyle=sText | sMuted
X=16
Y=34
W=268
ClipString=1
FontColor=#WarningColor#
Text=#Status#
ToolTipText=#Status#
Hidden=#StatusHidden#

[RLabel]
Meter=String
MeterStyle=sText | sLabel
X=16
Y=#RTop#
Text=Last 2 weeks
Hidden=#RNone#

[R1Name]
Meter=String
MeterStyle=sText | sName
X=16
Y=(#RTop#+20+0)
W=154
Text=#R1Name#
Hidden=#R1Hidden#

[R1Sub]
Meter=String
