; GENERATED by rainmeter/build_skins.py - edit that, not this file.
[Rainmeter]
Update=1000
AccurateText=1
Group=GameWidget
ContextTitle=Refresh game data
ContextAction=["#PythonW#" "#MainPy#" --refresh]
ContextTitle2=Ask Claude what to play
ContextAction2=["#PythonW#" "#MainPy#" --inspire]
ContextTitle3=Open service log folder
ContextAction3=["%APPDATA%\GameWidget"]

[Metadata]
Name=Game Widget - Panel
Author=benlaw7
Information=Recent, most played and dusty games stacked in one dark panel.
Version=0.1
License=MIT

[Variables]
@Include=#@#Style.inc
@Include2=#@#data.inc
; Layout (formulas, resolved where used)
Top=(44+(1-#StatusHidden#)*14)
RShown=(Min(#RCount#,4))
RH=((#RShown# > 0) ? (30+#RShown#*28) : 0)
RTop=#Top#
MShown=(Min(#MCount#,4))
MH=((#MShown# > 0) ? (30+#MShown#*28) : 0)
MTop=(#RTop#+#RH#)
DShown=(Min(#DCount#,4))
DH=((#DShown# > 0) ? (30+#DShown#*28) : 0)
DTop=(#MTop#+#MH#)
BtnY=((#DTop#+#DH#)+2)
PanelH=(#BtnY#+50)

[Background]
Meter=Shape
Shape=Rectangle 0.5,0.5,299,(#PanelH#-1),12 | Fill Color #Bg# | StrokeWidth 1 | Stroke Color #Border#

[Title]
Meter=String
MeterStyle=sText
X=16
Y=14
FontSize=11
FontWeight=700
Text=Games

[Meta]
Meter=String
MeterStyle=sText | sMuted
X=284
Y=18
StringAlign=Right
Text=#Updated#  [\x00B7]  #GameCount# games

[Status]
Meter=String
MeterStyle=sText | sMuted
X=16
Y=34
W=268
ClipString=1
FontColor=#Warn#
Text=#Status#
ToolTipText=#Status#
Hidden=#StatusHidden#

[RLabel]
Meter=String
MeterStyle=sText | sLabel
X=16
Y=#RTop#
Text=Last 2 weeks
Hidden=#RNone#

[R1Name]
Meter=String
MeterStyle=sText | sName
X=16
Y=(#RTop#+20+0)
W=154
Text=#R1Name#
ToolTipText=#R1Name#
Hidden=#R1Hidden#

[R1Sub]
Meter=String
MeterStyle=sText | sMuted
X=236
Y=((#RTop#+20+0)+2)
StringAlign=Right
Text=#R1Sub#
Hidden=#R1Hidden#

[R1Value]
Meter=String
